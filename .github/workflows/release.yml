name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and Validate Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validate PHP syntax
        run: |
          find . -name '*.php' -type f -exec php -l {} \;

      - name: Validate JavaScript syntax
        run: |
          find assets blocks -name '*.js' -type f -exec node --check {} \;

      - name: Build plugin zip
        run: bash tools/build-plugin-zip.sh

      - name: Validate plugin zip
        run: bash tests/test-plugin-zip.sh

      - name: Match tag to plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^[[:space:]]*\* Version: \([0-9][0-9.]*\).*/\1/p' mermaid-content-blocks.php | head -1)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Save verified plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-content-blocks
          path: build/mermaid-content-blocks.zip
          if-no-files-found: error
